[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellgenerator"
version = "0.2.0"
description = "Generate synthetic cell images for in silico CellProfiler feature rotation sensitivity analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Gregory Way", email = "gregory.way@gmail.com" },
    { name = "Hugh Warden", email = "hugh.warden@outlook.com" },
]
keywords = ["cellprofiler", "synthetic cells", "image analysis", "rotation invariance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=15",
    "cp-measure>=0.1.19",
]

[project.urls]
Repository = "https://github.com/gwaybio/cellgenerator"
"Bug Tracker" = "https://github.com/gwaybio/cellgenerator/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "sphinx-autodoc-typehints>=2.0",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cellgenerator"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["cellgenerator"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
