[tool.poetry]
name = "cellgenerator"
version = "0.2.0"
description = "Generate synthetic cell images for in silico CellProfiler feature rotation sensitivity analysis"
authors = [
    "Gregory Way <gregory.way@gmail.com>",
    "Hugh Warden <hugh.warden@outlook.com>",
]
readme = "README.md"
license = "MIT"
repository = "https://github.com/gwaybio/cellgenerator"
keywords = ["cellprofiler", "synthetic cells", "image analysis", "rotation invariance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.24"
scipy = ">=1.10"
pillow = ">=10.0"
matplotlib = ">=3.7"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
ruff = ">=0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = ["N999"]  # module names with underscores are fine here

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["cellgenerator"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
