name: cg-cellprofiler
# Isolated conda environment for CellProfiler feature extraction.
# CellProfiler's dependency tree conflicts with cellgenerator's docs deps
# (notably a pinned docutils), so it lives in its own env.
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate cg-cellprofiler
#
# Then tell cellgenerator where to find this Python:
#   export CELLPROFILER_PYTHON="$(conda run -n cg-cellprofiler which python)"
# Or pass it explicitly:
#   CellProfilerMeasurer(python="/path/to/miniconda3/envs/cg-cellprofiler/bin/python")

channels:
  - conda-forge
  - defaults

dependencies:
  # Pin to Python 3.9 — CellProfiler 4.2.x is tested on 3.8-3.10
  - python=3.9

  # CellProfiler and its binary dependencies (prebuilt wheels on conda-forge,
  # no C compiler required)
  - cellprofiler>=4.2,<5

  # Pillow for loading images inside the runner script
  - pillow>=9.0

  # numpy is pulled in by cellprofiler but pin here for clarity
  - numpy>=1.21,<2
