name: Lint

on:
  push:
    branches: [main, "software-gardening"]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Check formatting
        run: ruff format --check .

      - name: Check lint
        run: ruff check .
